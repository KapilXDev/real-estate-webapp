  #   volumes: [minio_data:/data]

  # --- Enable when the first event fan-out lands --------------------------------------
  # redpanda:
  #   image: redpandadata/redpanda:latest
  #   container_name: tricity-redpanda
  #   command:
  #     - redpanda start
